name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native-app/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android platform already exists, skipping npx cap add android"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch native project (focus plugin, manifest, MainActivity)      - name: Debug workspace before patch
        run: |
          echo "Working directory: $(pwd)"
          echo "Listing native-app:"
          ls -la
          echo "Listing native-app/android (if exists):"
          ls -la android || true
          echo "Show tree (limited) under native-app:"
          find . -maxdepth 3 -type d -print
          echo "Show files (limited) under native-app:"
          find . -maxdepth 3 -type f -print | sed -n '1,200p'
        run: python3 patch_project.py
      - name: Debug workspace before patch
        run: |
          echo "Working directory: $(pwd)"
          echo "Listing native-app:"
          ls -la
          echo "Listing native-app/android (if exists):"
          ls -la android || true
          echo "Show tree (limited) under native-app:"
          find . -maxdepth 3 -type d -print
          echo "Show files (limited) under native-app:"
          find . -maxdepth 3 -type f -print | sed -n '1,200p'
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: native-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: times-up-debug-apk
          path: native-app/android/app/build/outputs/apk/debug/app-debug.apk
